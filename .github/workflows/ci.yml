name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Self-hosted runner requirements documented in docs/CI.md.
# Required labels on the runner: `self-hosted`. Optional labels: `linux`, `x64`.

jobs:
  test:
    name: Compile + migrations + integrity
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure prerequisites (auto-install if missing)
        run: bash .github/ensure-prereqs.sh

      - name: Install pymysql
        run: |
          set -e
          for c in python3 python python3.12 python3.11 python3.10; do
            if command -v "$c" >/dev/null 2>&1 \
               && "$c" -c "import sys" >/dev/null 2>&1; then
              # --break-system-packages: PEP 668 marks the runner's system
              # Python as externally-managed, blocking a plain --user install.
              # The flag bypasses that guard; with --user the install stays
              # confined to the user site (~/.local), not system-wide.
              "$c" -m pip install --user --break-system-packages --quiet -r schema/scripts/requirements.txt
              break
            fi
          done

      - name: Run test harness
        run: bash tests/run.sh

      - name: Upload compiled .smx
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bizzymod_stats-smx
          path: plugin/build/bizzymod_stats.smx
          if-no-files-found: error
          retention-days: 14
